<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Huellitas - Contáctenos</title>
    <link rel="icon" type="image/png" href="./assets/faviconHuellitas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/contact.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

<body>
    <!-- ENCABEZADO Y MENU (COMPONENTE) -->
    <div id="header-container"></div>

    <div class="container py-5">
      <div class="row">
        <div class="col-md-2">
          <!-- Publicidad futura -->
        </div>
        <div class="col-md-8 d-flex justify-content-center">
          <!-- Contenido principal -->
          <div class="contact-card w-75 p-5 bg-color-green border-color-brown rounded-3">
            <div class="form-header">
              <h2 class="fs-6 fw-semibold text-uppercase text-secondary">CONTÁCTANOS!</h2>
              <h1 class="text-color-foreground fs-1 fw-bold">Envíanos un mensaje</h1>
              <p class="text-secondary lh-base fs-5">
                Complete el siguiente formulario y nos comunicaremos con usted
                en breve.
              </p>
            </div>

            <form class="row g-3 ">
              <div class="col-md-6">
                <label for="name" class="form-label text-color-foreground fw-semibold">Nombre</label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  placeholder="Pepito Perez"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label text-color-foreground fw-semibold">Teléfono</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  placeholder="(+57) 123-4567"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-12">
                <label for="email" class="form-label text-color-foreground fw-semibold">Correo electrónico</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="jane@example.com"
                  required
                />
              </div>

              <div class="col-12">
                <label for="message" class="form-label text-color-foreground fw-semibold">Mensaje</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="¿Cómo te puedo ayudar?"
                  class="form-control"
                  required
                ></textarea>
              </div>
              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-custome btn-lg">Enviar mensaje</button>
              </div>
            </form>
          </div>
        </div>
        <div class="col-md-2">
          <!-- Noticias futuras -->
        </div>
      </div>
    </div>


    <!-- FOOTER (COMPONENTE) -->
    <div id="footer-container"></div>

    <!-- ARCHIVOS JAVASCRIPT Y COMPONENTES -->
    <script src="./script/components.js"></script>
    <script src="./script/contact.js"></script>
  </body>
</html>
