<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Huellitas - Contáctenos</title>
    <link rel="icon" type="image/png" href="./assets/faviconHuellitas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/contact.css" />
    <link rel="stylesheet" href="./css/index.css" />
</head>

<body>
    <!-- ENCABEZADO Y MENU (COMPONENTE) -->
    <div id="header-container"></div>

    <div class="contact-page">
        <form class="contact-card">
            <div class="form-header">
                <p class="eyebrow">CONTÁCTANOS!</p>
                <h1>Envíanos un mensaje</h1>
                <p>Complete el siguiente formulario y nos comunicaremos con usted en breve.</p>
            </div>

            <div class="field-grid">
                <div class="field">
                    <label for="name">Nombre</label>
                    <input id="name" name="name" type="text" placeholder="Pepito Perez" required />
                </div>

                <div class="field">
                    <label for="phone">Teléfono</label>
                    <input id="phone" name="phone" type="tel" placeholder="(+57) 123-4567" />
                </div>
            </div>

            <div class="field">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" placeholder="jane@example.com" required />
            </div>

            <div class="field">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" placeholder="¿Cómo te puedo ayudar?" required></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>
        </form>
    </div>


    <!-- FOOTER (COMPONENTE) -->
    <div id="footer-container"></div>

    <!-- ARCHIVOS JAVASCRIPT Y COMPONENTES -->
    <script src="./script/components.js"></script>
    <script src="./script/contact.js"></script>
</body>

</html>
